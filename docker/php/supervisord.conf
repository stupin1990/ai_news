[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=GetNewsAiContent,GetNewsContent --tries=3 --backoff=10 --max-time=3600 --no-interaction
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=5
startsecs=0
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
