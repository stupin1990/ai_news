services:
  # Nginx
  nginx:
    image: nginx:stable-alpine
    container_name: ai_news_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - ai_news_network

  # PHP-FPM
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        WWWUSER: "${WWWUSER:-1000}"
        WWWGROUP: "${WWWGROUP:-1000}"
        NODE_VERSION: "${NODE_VERSION:-22}"
    container_name: ai_news_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - php_socket:/var/run/php
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: "serverName=ai_news"
      #XDEBUG_MODE: "${XDEBUG_MODE:-develop,debug}"
      XDEBUG_MODE: "off"
      XDEBUG_CONFIG: "client_host=host.docker.internal"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_news_network

  # PostgreSQL
  pgsql:
    image: postgres:17-alpine
    container_name: ai_news_pgsql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ai_news}"
      POSTGRES_USER: "${DB_USERNAME:-root}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-123456}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-ai_news}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_news_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ai_news_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:-secret}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_news_network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ai_news_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai_news_network

  # Queue Worker
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
          WWWUSER: "${WWWUSER:-1000}"
          WWWGROUP: "${WWWGROUP:-1000}"
    #container_name: ai_news_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=GetNewsAiContent,GetNewsContent --tries=3 --backoff=10
    deploy:
      replicas: 10
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
      - redis
      - rabbitmq
    networks:
      - ai_news_network

  # Scheduler (Cron)
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ai_news_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      bash -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
    networks:
      - ai_news_network

  # Node.js (Vite dev server)
  node:
    image: node:22-alpine
    container_name: ai_news_node
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
    networks:
      - ai_news_network

  # Mailpit (local email testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: ai_news_mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAIL_DASHBOARD_PORT:-8025}:8025"
    profiles:
      - dev
    networks:
      - ai_news_network

  # pgAdmin (database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai_news_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-secret}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - pgsql
    profiles:
      - dev
    networks:
      - ai_news_network

volumes:
  pgsql_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  php_socket:
    driver: local
  pgadmin_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  ai_news_network:
    driver: bridge
