services:
  nginx:
    image: nginx:stable-alpine
    container_name: ai_news_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - ai_news_network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        WWWUSER: "${WWWUSER:-1000}"
        WWWGROUP: "${WWWGROUP:-1000}"
        NODE_VERSION: "${NODE_VERSION:-22}"
        INSTALL_XDEBUG: "false"
    container_name: ai_news_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - php_socket:/var/run/php
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      XDEBUG_MODE: "off"
      PHP_IDE_CONFIG: "serverName=ai_news"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ai_news_network

  pgsql:
    image: postgres:17-alpine
    container_name: ai_news_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ai_news}"
      POSTGRES_USER: "${DB_USERNAME:-root}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-123456}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-ai_news}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_news_network

  redis:
    image: redis:7-alpine
    container_name: ai_news_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-secret}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_news_network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ai_news_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - ai_news_network

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        WWWUSER: "${WWWUSER:-1000}"
        WWWGROUP: "${WWWGROUP:-1000}"
        NODE_VERSION: "${NODE_VERSION:-22}"
        INSTALL_XDEBUG: "false"
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=GetNewsAiContent,GetNewsContent --tries=3 --backoff=10 --max-time=3600 --no-interaction
    volumes:
      - ./:/var/www/html
    depends_on:
      - php
      - redis
      - rabbitmq
    networks:
      - ai_news_network

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        WWWUSER: "${WWWUSER:-1000}"
        WWWGROUP: "${WWWGROUP:-1000}"
        NODE_VERSION: "${NODE_VERSION:-22}"
        INSTALL_XDEBUG: "false"
    container_name: ai_news_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction;
        sleep 60;
      done"
    volumes:
      - ./:/var/www/html
    depends_on:
      - php
    networks:
      - ai_news_network

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: ai_news_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@local.test}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-change_me_now}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - ai_news_network

volumes:
  pgsql_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  php_socket:
    driver: local
  rabbitmq_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ai_news_network:
    driver: bridge
